name: Yardang Build
description: 'Install, build, and deploy Sphinx documentation with Yardang'

inputs:
  token:
    type: string
    description: "GitHub Token"
    required: true
  version:
    type: choice
    description: "Python version to install"
    options:
      - '3.9'
      - '3.10'
      - '3.11'
      - '3.12'
      - '3.13'
    default: '3.11'
  install_path:
    type: string
    description: "Path to project to install"
    default: '.'

runs:
  using: 'composite'
  steps:
    - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
    - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
      with:
        python-version: ${{ inputs.version }}
        cache: "pip"
        cache-dependency-path: |
          "**/pyproject.toml"
          "**/setup.py"
    - run: pip install uv
      shell: bash
    - run: pip install ${{ inputs.install_path }}
      shell: bash
    - run: uv pip install "yardang[breathe,rust,js,wiki]>=0.5.1" --system
      shell: bash
    - run: yardang build
      shell: bash
    - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4.1.0
      with:
        publish_branch: gh-pages
        github_token: ${{ inputs.token }}
        publish_dir: docs/html
        force_orphan: true
